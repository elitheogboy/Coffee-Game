<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cafe Rush 3D – Walk-around Coffee Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#1d2f29;color:#f3efe2;font-family:Fredoka,system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;font-weight:600;font-size:17px;pointer-events:none}
#hud span{background:rgba(16,28,23,.75);padding:6px 12px;border-radius:999px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(16,28,23,.82);padding:9px 16px;border-radius:16px;font-weight:600;font-size:15px;text-align:center;max-width:70%;pointer-events:none}
#turn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:12px 14px;border:0;border-radius:16px;background:#e0a458;color:#241504;font:700 15px Fredoka,sans-serif}
#tags,#tix{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;background:rgba(243,239,226,.92);color:#16241f;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;display:none;will-change:transform}
.tag.far{opacity:.5}.tag.on{background:#7fd1a8;opacity:1}
.tix{position:absolute;left:0;top:0;width:118px;margin-left:-59px;background:#f3efe2;color:#16241f;border-radius:12px;padding:6px 8px;font-size:13px;font-weight:600;text-align:center;display:none;will-change:transform}
.bar{height:5px;background:#cfd8d0;border-radius:3px;margin-top:4px}.bar i{display:block;height:100%;border-radius:3px}
#jb,#jk{position:fixed;border-radius:50%;display:none;pointer-events:none}
#jb{width:100px;height:100px;border:3px solid rgba(243,239,226,.5);margin:-50px 0 0 -50px}
#jk{width:44px;height:44px;background:rgba(243,239,226,.7);margin:-22px 0 0 -22px}
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#f3efe2;color:#16241f;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#msg.show{opacity:1}
.ov{position:fixed;inset:0;background:rgba(10,20,16,.9);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
.ov div{max-width:360px}.ov h1{font-size:36px;margin:0 0 8px}.ov p{margin:0 0 16px;color:#b7cbc1;line-height:1.4}
.go{padding:15px;border:0;border-radius:16px;background:#e0a458;color:#241504;font:700 20px Fredoka,sans-serif;width:100%}
#modes{display:flex;gap:8px;margin:0 0 8px}.mode{flex:1;padding:11px 4px;border-radius:13px;border:2px solid #335046;background:transparent;color:#f3efe2;font:600 15px Fredoka,sans-serif}.mode.on{background:#7fd1a8;border-color:#7fd1a8;color:#10201a}#mdesc{min-height:20px;margin:0 0 14px;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<div id="tags"></div><div id="tix"></div>
<div id="hud"><span id="hearts"></span><span id="cash"></span><span id="best"></span></div>
<div id="hint"></div>
<button id="turn">↻ Turn around</button>
<div id="jb"></div><div id="jk"></div>
<div id="msg"></div>
<div class="ov" id="ov"><div>
  <div id="ovc"><h1>☕ Cafe Rush 3D</h1>
  <p>You’re the barista. Customers queue at the counter. Turn around to the back table and tap a cup size, a drink and an extra, then walk to the counter and tap the customer to serve.<br><br>Left thumb walks, dragging on the right looks around. On a keyboard use WASD and the arrow keys.</p></div>
  <div id="modes"></div><p id="mdesc"></p>
  <button class="go" id="start">Open the shop</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var SIZES=["Small","Medium","Large"],SP=[2,3,4],SC=[[.85,.8],[1,1],[1.12,1.25]];
var DRINKS=[["Latte","🥛"],["Mocha","🍫"],["Cold brew","🧊"],["Iced tea","🍵"],["Frappe","🥤"]];
var DCOL=[0xc89a6b,0x4a2c1d,0x24160f,0xd9822b,0xe8d2b4],ICE=[0,0,1,1,1];
var EXTRAS=["Plain","Vanilla","Caramel","Whip"],ECOL=[0x9aa5a0,0xf3e3a0,0xc77a1c,0xfffaf0];
var SX=[-2.4,0,2.4],SZ=-1.6,TZ=5.6;
var SHIRT=[0xe2695a,0x4f8fd6,0xe0a458,0x8e6bbf,0x7fd1a8,0xd96aa7],SKIN=[0xf2c9a0,0xd9a36f,0x9b6a43,0x6b4328],HAIR=[0x2a1a10,0x6b3f1d,0xd8b45a,0x1a1a1a,0xb0b0b0];
var S={hp:3,cash:0,served:0,q:[null,null,null],run:false},pick={s:null,d:null,e:null},spawn=null,L=[];
var px=0,pz=3.6,yaw=0,pitch=0,tY=null,best=0;
var MODES=[{n:"Easy",hp:5,pat:1.6,sp:1.5,pay:1,d:"Patient customers, slower queue, five hearts."},{n:"Normal",hp:3,pat:1,sp:1,pay:1,d:"The classic shift with three hearts."},{n:"Rush hour",hp:3,pat:.65,sp:.5,pay:1.5,d:"Impatient crowds, nonstop orders, 1.5x pay."}],mode=1;
function loadBest(){try{best=+localStorage.getItem("cafebest"+mode)||0}catch(e){best=0}}
var AC=null;
function snd(f,d,type,v,f2){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type||"sine";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function $(i){return document.getElementById(i)}
function rnd(n){return Math.floor(Math.random()*n)}
function label(o){return SIZES[o.s]+" "+DRINKS[o.d][0]+(o.e?" + "+EXTRAS[o.e].toLowerCase():"")}

/* ---------- scene ---------- */
var scene=new THREE.Scene();scene.background=new THREE.Color(0x1d2f29);scene.fog=new THREE.Fog(0x1d2f29,12,28);
var cam=new THREE.PerspectiveCamera(70,1,.1,60);cam.rotation.order="YXZ";scene.add(cam);
var rend=new THREE.WebGLRenderer({antialias:true});rend.setPixelRatio(Math.min(devicePixelRatio||1,2));
rend.shadowMap.enabled=true;document.body.insertBefore(rend.domElement,document.body.firstChild);
function mesh(geo,col,x,y,z){var m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:.7}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m}
function box(w,h,d,c,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),c,x,y,z)}
scene.add(new THREE.HemisphereLight(0xfff1d6,0x2b3a34,.9));
var pl=new THREE.PointLight(0xffd9a0,.7,18);pl.position.set(0,4.2,1);scene.add(pl);
var sun=new THREE.DirectionalLight(0xffe2b8,.6);sun.position.set(3,8,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
var sc=sun.shadow.camera;sc.left=-9;sc.right=9;sc.top=9;sc.bottom=-9;scene.add(sun);
var fl=mesh(new THREE.PlaneGeometry(50,50),0x6b4a32,0,0,0);fl.rotation.x=-Math.PI/2;scene.add(fl);
scene.add(box(50,9,.2,0x2f5446,0,4.5,6.3));
scene.add(box(.2,9,14,0x2f5446,-7.5,4.5,-.5),box(.2,9,14,0x2f5446,7.5,4.5,-.5));
scene.add(box(6.1,9,.2,0x2f5446,-4.45,4.5,-7),box(6.1,9,.2,0x2f5446,4.45,4.5,-7));
scene.add(box(15,.2,14,0x24362f,0,5.1,-.5));
scene.add(box(9.3,1.06,1.6,0x5a3a26,0,.53,.6),box(9.6,.12,1.9,0xd8c7a8,0,1.1,.6));
scene.add(box(14.6,1.06,.9,0x5a3a26,0,.53,TZ),box(14.8,.12,1.1,0xd8c7a8,0,1.1,TZ));
[[-4,-4],[4.5,-4.5]].forEach(function(p){scene.add(mesh(new THREE.CylinderGeometry(.6,.6,.08,20),0xd8c7a8,p[0],.85,p[1]),mesh(new THREE.CylinderGeometry(.08,.08,.8,8),0x222222,p[0],.4,p[1]))});
var cv=document.createElement("canvas");cv.width=512;cv.height=256;var cx=cv.getContext("2d");
cx.fillStyle="#17251f";cx.fillRect(0,0,512,256);cx.strokeStyle="#e0a458";cx.lineWidth=8;cx.strokeRect(10,10,492,236);
cx.fillStyle="#f3efe2";cx.textAlign="center";cx.font="700 64px Fredoka,sans-serif";cx.fillText("CAFE RUSH",256,100);
cx.fillStyle="#7fd1a8";cx.font="600 34px Fredoka,sans-serif";cx.fillText("Latte  Mocha  Cold brew",256,160);cx.fillText("Iced tea  Frappe",256,208);
var menu=new THREE.Mesh(new THREE.PlaneGeometry(4,2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}));menu.position.set(4.5,3.2,-6.85);scene.add(menu);
[-3.2,0,3.2].forEach(function(x){var l=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),new THREE.MeshStandardMaterial({color:0xffe0a0,emissive:0xffc766,emissiveIntensity:.9}));l.position.set(x,4.2,0);scene.add(l)});

function cupShell(g){
  var s=new THREE.Mesh(new THREE.CylinderGeometry(.34,.25,1,24,1,true),new THREE.MeshStandardMaterial({color:0xf1efe6,side:THREE.DoubleSide,roughness:.5}));s.position.y=.5;g.add(s);
  var b=new THREE.Mesh(new THREE.CylinderGeometry(.325,.285,.3,24,1,true),new THREE.MeshStandardMaterial({color:0x2e9e6c,side:THREE.DoubleSide}));b.position.y=.45;g.add(b)}
/* station items on back table */
var items=[],TG=[];
function station(k,i,x,g,text){
  g.position.set(x,1.16,TZ);g.userData={k:k,i:i};scene.add(g);items.push(g);
  var d=document.createElement("div");d.className="tag";d.textContent=text;$("tags").appendChild(d);
  TG.push({d:d,p:new THREE.Vector3(x,2.7,TZ),g:g,k:k,i:i})}
SIZES.forEach(function(n,i){var g=new THREE.Group(),in_=new THREE.Group();cupShell(in_);in_.scale.set(SC[i][0],SC[i][1],SC[i][0]);g.add(in_);station("s",i,-6.3+i*.9,g,n)});
DRINKS.forEach(function(d,i){var g=new THREE.Group();g.add(box(.8,1.2,.6,0x8f9b96,0,.6,0),box(.5,.55,.06,DCOL[i],0,.7,-.32),mesh(new THREE.CylinderGeometry(.06,.06,.2,10),0x222222,0,.25,-.3));station("d",i,-2.8+i*1.4,g,d[0])});
EXTRAS.forEach(function(n,i){var g=new THREE.Group();g.add(mesh(new THREE.CylinderGeometry(.14,.17,.55,14),ECOL[i],0,.28,0),mesh(new THREE.CylinderGeometry(.06,.06,.18,8),0x222222,0,.62,0));station("e",i,4+i*.85,g,n)});
/* held cup */
var cup=new THREE.Group();cupShell(cup);cam.add(cup);cup.position.set(.6,-.62,-1.3);cup.rotation.y=.4;
var lg=new THREE.CylinderGeometry(.32,.24,.88,24);lg.translate(0,.46,0);
var liq=new THREE.Mesh(lg,new THREE.MeshStandardMaterial({color:0xc89a6b,roughness:.4}));cup.add(liq);
var ice=new THREE.Group();[[-.12,.1],[.1,.05],[0,-.14],[.14,-.1]].forEach(function(p,i){var c=mesh(new THREE.BoxGeometry(.16,.16,.16),0xe8f4f8,p[0],.92+i*.02,p[1]);c.material.transparent=true;c.material.opacity=.7;c.rotation.set(i,i*2,0);ice.add(c)});cup.add(ice);
var topW=new THREE.Group();[[.22,.98],[.16,1.13],[.1,1.25]].forEach(function(p){topW.add(mesh(new THREE.SphereGeometry(p[0],16,12),0xfffaf0,0,p[1],0))});cup.add(topW);
function drizzle(col){var g=new THREE.Group();[.2,.1].forEach(function(r){var t=mesh(new THREE.TorusGeometry(r,.045,8,24),col,0,.92,0);t.rotation.x=Math.PI/2;g.add(t)});cup.add(g);return g}
var topV=drizzle(0xf3e3a0),topC=drizzle(0xc77a1c);
function makeCust(){
  var g=new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(.34,.42,1.1,16),SHIRT[rnd(6)],0,.55,0),mesh(new THREE.SphereGeometry(.3,20,16),SKIN[rnd(4)],0,1.42,0),
    mesh(new THREE.SphereGeometry(.315,20,10,0,Math.PI*2,0,Math.PI*.5),HAIR[rnd(5)],0,1.47,-.03),
    mesh(new THREE.SphereGeometry(.04,8,8),0x1a1a1a,-.11,1.44,.27),mesh(new THREE.SphereGeometry(.04,8,8),0x1a1a1a,.11,1.44,.27));
  return g}

/* ---------- UI ---------- */
var LB=[0,1,2].map(function(){var d=document.createElement("div");d.className="tix";d.innerHTML='<div></div><div class="bar"><i></i></div>';$("tix").appendChild(d);return d});
var fill=0,fillT=0;
function say(t){var m=$("msg");m.textContent=t;m.classList.add("show");clearTimeout(say.t);say.t=setTimeout(function(){m.classList.remove("show")},1200)}
function draw(){
  $("hearts").textContent="❤️".repeat(Math.max(S.hp,0))+"🖤".repeat(Math.max((S.mh||3)-Math.max(S.hp,0),0));
  $("cash").textContent="$"+S.cash;$("best").textContent=MODES[mode].n+", best $"+best;
  var p=[pick.s===null?"size?":SIZES[pick.s],pick.d===null?"drink?":DRINKS[pick.d][0],pick.e===null?"extra?":EXTRAS[pick.e]];
  $("hint").textContent="In hand: "+p.join(", ");
  var s=pick.s===null?1:pick.s;cup.scale.set(SC[s][0]*.7,SC[s][1]*.7,SC[s][0]*.7);
  if(pick.d!==null)liq.material.color.setHex(DCOL[pick.d]);fillT=pick.d===null?0:1;
  items.forEach(function(g){var on=pick[g.userData.k]===g.userData.i;g.scale.setScalar(on?1.18:1)});
  TG.forEach(function(t){t.d.classList.toggle("on",pick[t.k]===t.i)})}
function end(){
  S.run=false;clearTimeout(spawn);
  if(S.cash>best){best=S.cash;try{localStorage.setItem("cafebest"+mode,best)}catch(e){}}
  $("ovc").innerHTML='<h1>Closed for the day</h1><p>'+MODES[mode].n+': you served '+S.served+' customers and earned $'+S.cash+'. Best: $'+best+'.</p>';$("start").textContent="Open again";
  $("ov").classList.remove("hide");draw()}
function start(){
  S.q.forEach(function(c){if(c)scene.remove(c.g)});L.forEach(function(l){scene.remove(l.g)});L=[];
  S={hp:MODES[mode].hp,mh:MODES[mode].hp,cash:0,served:0,q:[null,null,null],run:true};pick={s:null,d:null,e:null};
  $("ov").classList.add("hide");addCust();draw();clearTimeout(spawn);nextSpawn()}
function addCust(){
  var free=[0,1,2].filter(function(i){return !S.q[i]});if(!free.length)return;
  var i=free[rnd(free.length)],max=Math.max(16,34-S.served*.6)*MODES[mode].pat,g=makeCust();snd(1200,.25,"sine",.1);
  g.position.set(0,0,-9.5);g.userData={k:"c",i:i};scene.add(g);
  S.q[i]={g:g,max:max,p:max,o:{s:rnd(3),d:rnd(5),e:rnd(4)}}}
function leave(c,angry){if(angry)c.g.children[0].material.color.setHex(0xe2695a);L.push({g:c.g,v:angry?4.5:3})}
function nextSpawn(){spawn=setTimeout(function(){if(S.run){addCust();nextSpawn()}},Math.max(2500,7000-S.served*120)*MODES[mode].sp)}

/* ---------- tapping ---------- */
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function tapAt(x,y){
  if(!S.run)return;
  ndc.set(x/innerWidth*2-1,-y/innerHeight*2+1);ray.setFromCamera(ndc,cam);
  var objs=items.concat(S.q.filter(Boolean).map(function(c){return c.g}));
  var h=ray.intersectObjects(objs,true);if(!h.length)return;
  var o=h[0].object;while(o&&!(o.userData&&o.userData.k))o=o.parent;if(!o)return;
  var u=o.userData,d=Math.hypot(px-o.position.x,pz-o.position.z);
  if(u.k==="c"){
    var c=S.q[u.i];if(!c||c.g!==o||o.position.z<SZ-.15)return;
    if(pick.s===null||pick.d===null||pick.e===null){say("Finish the cup first");return}
    if(d>5){say("Step up to the counter");return}
    var ok=c.o.s===pick.s&&c.o.d===pick.d&&c.o.e===pick.e;
    if(ok){var tip=Math.round(c.p/c.max*3),pay=Math.round((SP[c.o.s]+(c.o.e?1:0)+tip)*MODES[mode].pay);S.cash+=pay;S.served++;say("+$"+pay+(tip?" (tip $"+tip+")":""));snd(880,.12,"triangle");setTimeout(function(){snd(1320,.18,"triangle")},110);leave(c,false)}
    else{S.hp--;say("Wrong order 😬");snd(180,.3,"sawtooth",.1,90);leave(c,true)}
    S.q[u.i]=null;pick={s:null,d:null,e:null};if(S.hp<=0)end();draw()}
  else{if(d>3.4){say("Walk closer");return}pick[u.k]=u.i;snd(620,.07,"triangle");draw()}}

/* ---------- controls ---------- */
var cvs=rend.domElement,joy={id:null,x:0,y:0,vx:0,vy:0},look={id:null,x:0,y:0},tap={},keys={};
cvs.addEventListener("pointerdown",function(e){
  cvs.setPointerCapture(e.pointerId);tap[e.pointerId]={x:e.clientX,y:e.clientY,t:performance.now(),m:0};
  if(e.pointerType!=="mouse"&&e.clientX<innerWidth*.4&&joy.id===null){
    joy.id=e.pointerId;joy.x=e.clientX;joy.y=e.clientY;
    [$("jb"),$("jk")].forEach(function(n){n.style.display="block";n.style.left=e.clientX+"px";n.style.top=e.clientY+"px"})}
  else if(look.id===null){look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY}});
cvs.addEventListener("pointermove",function(e){
  var r=tap[e.pointerId];if(!r)return;
  if(e.pointerId===joy.id){
    var dx=e.clientX-joy.x,dy=e.clientY-joy.y,m=Math.hypot(dx,dy),k=m>50?50/m:1;dx*=k;dy*=k;
    joy.vx=dx/50;joy.vy=dy/50;$("jk").style.left=(joy.x+dx)+"px";$("jk").style.top=(joy.y+dy)+"px";r.m+=m}
  else if(e.pointerId===look.id){
    var lx=e.clientX-look.x,ly=e.clientY-look.y;look.x=e.clientX;look.y=e.clientY;
    yaw-=lx*.005;pitch=Math.max(-.8,Math.min(.8,pitch-ly*.004));tY=null;r.m+=Math.abs(lx)+Math.abs(ly)}});
function up(e){
  var r=tap[e.pointerId];if(!r)return;
  if(r.m<10&&performance.now()-r.t<300&&e.type==="pointerup")tapAt(e.clientX,e.clientY);
  if(e.pointerId===joy.id){joy.id=null;joy.vx=joy.vy=0;$("jb").style.display=$("jk").style.display="none"}
  if(e.pointerId===look.id)look.id=null;delete tap[e.pointerId]}
cvs.addEventListener("pointerup",up);cvs.addEventListener("pointercancel",up);
addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=1;if(e.key==="t")tY=yaw+Math.PI});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=0});
$("turn").onclick=function(){tY=yaw+Math.PI};

/* ---------- loop ---------- */
var clk=new THREE.Clock(),v3=new THREE.Vector3(),bob=0;
function rs(){rend.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener("resize",rs);
function proj(d,x,y,z,hideFar){
  v3.set(x,y,z).project(cam);
  if(v3.z>1){d.style.display="none";return}
  d.style.display="block";d.style.transform="translate("+((v3.x*.5+.5)*innerWidth)+"px,"+((-v3.y*.5+.5)*innerHeight)+"px) translate(-50%,-100%)"}
function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
  if(keys.arrowleft){yaw+=2*dt;tY=null}if(keys.arrowright){yaw-=2*dt;tY=null}
  if(tY!==null){yaw+=(tY-yaw)*Math.min(1,dt*8);if(Math.abs(tY-yaw)<.01){yaw=tY;tY=null}}
  var fw=-joy.vy+(keys.w?1:0)-(keys.s?1:0),st=joy.vx+(keys.d?1:0)-(keys.a?1:0),sp=3.2;
  px+=(-Math.sin(yaw)*fw+Math.cos(yaw)*st)*sp*dt;pz+=(-Math.cos(yaw)*fw-Math.sin(yaw)*st)*sp*dt;
  px=Math.max(-6.8,Math.min(6.8,px));pz=Math.max(2,Math.min(4.8,pz));
  bob+=Math.hypot(fw,st)*dt*8;
  cam.position.set(px,1.65+Math.sin(bob)*.04,pz);cam.rotation.set(pitch,yaw,0);
  fill+=(fillT-fill)*Math.min(1,dt*8);liq.scale.y=Math.max(fill,.001);liq.visible=fill>.02;
  var full=fill>.9;ice.visible=full&&pick.d!==null&&ICE[pick.d]===1;topW.visible=full&&pick.e===3;topV.visible=full&&pick.e===1;topC.visible=full&&pick.e===2;
  S.q.forEach(function(c,i){
    var d=LB[i];if(!c){d.style.display="none";return}
    var g=c.g,dx=SX[i]-g.position.x,dz=SZ-g.position.z,dd=Math.hypot(dx,dz);
    if(dd>.05){var s=Math.min(dd,dt*3);g.position.x+=dx/dd*s;g.position.z+=dz/dd*s;g.rotation.y=Math.atan2(dx,dz);g.position.y=Math.abs(Math.sin(t*10))*.08;d.style.display="none";return}
    g.rotation.y=Math.atan2(px-g.position.x,pz-g.position.z);g.position.y=0;
    if(S.run){c.p-=dt;if(c.p<=0){S.hp--;say("A customer walked out 😠");snd(220,.35,"square",.07,110);leave(c,true);S.q[i]=null;if(S.hp<=0)end();draw();return}}
    var r=c.p/c.max,bi=d.lastChild.firstChild;
    d.firstChild.textContent=label(c.o);bi.style.width=(r*100)+"%";bi.style.background=r<.35?"#d4513f":r<.65?"#d99a3a":"#2e9e6c";
    proj(d,g.position.x,2.1,g.position.z)});
  TG.forEach(function(g){
    var far=Math.hypot(px-g.p.x,pz-g.p.z);
    if(far>10){g.d.style.display="none";return}
    g.d.classList.toggle("far",far>3.4);proj(g.d,g.p.x,g.p.y,g.p.z)});
  for(var k=L.length-1;k>=0;k--){var l=L[k],g=l.g,dx=-g.position.x,dz=-10-g.position.z,dd=Math.hypot(dx,dz),s=dt*l.v;
    g.position.x+=dx/dd*s;g.position.z+=dz/dd*s;g.rotation.y=Math.atan2(dx,dz);g.position.y=Math.abs(Math.sin(t*12))*.08;
    if(g.position.z<-9.5){scene.remove(g);L.splice(k,1)}}
  rend.render(scene,cam)}
MODES.forEach(function(m,i){var b=document.createElement("button");b.className="mode";b.textContent=m.n;b.onclick=function(){setMode(i)};$("modes").appendChild(b)});
function setMode(m){mode=m;loadBest();[].forEach.call($("modes").children,function(b,i){b.classList.toggle("on",i===m)});$("mdesc").textContent=MODES[m].d;draw()}
setMode(1);rs();frame();
$("start").onclick=start;
</script>
